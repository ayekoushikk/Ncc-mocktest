header.topbar {

.top {

.cta {

.nav {

.tb { display: flex; gap: 8px; margin: 0 0 12px; }
.tb button {

}
.tb .end { background: var(--no); border-color: var(--no); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.grid button {

.grid .ans { background: var(--acs); border-color: var(--ac); color: var(--ac); }
.grid .mk { box-shadow: inset 0 0 0 2px #a78bfa; }
.grid .cur { outline: 2px solid var(--tx); }
.book-sec { margin-bottom: 14px; }
.book-sec h3 { font-size: 15px; color: var(--ac2); margin: 0 0 6px; }
.book-sec ul { margin: 0; padding-left: 18px; }
.book-sec li { margin-bottom: 5px; font-size: 14px; }
.warn-box {
  background: rgba(245, 158, 11, 0.12);
  border-left: 3px solid var(--ac);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13.5px;
  margin-top: 8px;
}
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.tbl th, .tbl td { border: 1px solid var(--bd); padding: 7px 8px; text-align: left; }
.tbl th { background: rgba(148, 163, 184, 0.12); font-weight: 700; }
.flashcard {
  min-height: 190px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

}
input.inp {

  border-radius: 10px;

  color: var(--tx);

  margin-bottom: 10px;

.row-sw {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--bd);
}
.row-sw:last-child { border-bottom: 0; }
.modal-bg {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0, 0, 0, 0.65);

.modal {
  background: var(--bg2);
  border: 1px solid var(--bd);
  border-radius: 16px;

  width: 100%;

.prog-track { height: 7px; background: var(--bd); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.prog-fill { height: 100%; background: var(--ok); border-radius: 99px; }
</style>

    N(4,"moderate","What are the four basic elements required in an aviation topographical map?","Correct areas, identical bearings, true shapes, and accurate distances via a graduated scale (km, NM, statute miles)","Only roads, railways, rivers, and temples","Radar frequencies, runway lights, squawk codes, and NOTAMs","Cloud heights, wind speeds, temperatures, and pressures",59,"A good aviation map preserves correct areas, true bearings, true shapes, and accurate graduated distance scales in km, NM, and statute miles."),
    N(4,"moderate","What are the four upward air motions that cool damp air to form clouds?","Turbulent motion, uphill currents over slopes, large-scale surface-heating convection, and warm moist air rising over a cold air wedge","Downward subsidence, dry wind, sea tides, and aircraft propwash","Solar flares, lunar gravity, ocean currents, and volcanic ash","Jet stream friction, ozone decay, magnetic storms, and lightning",64,"Clouds form when damp air rises and cools via turbulence, orographic slope lifting, convective heating, or frontal wedging over cold air."),

    N(6,"moderate","Which materials reflect radar signals especially well, and what four target parameters can radar determine?","Metals, seawater, and wet lands; determines range, altitude, direction, and speed","Dry sand, wood, and glass; determines weight and fuel","Clouds and dry snow only; determines pilot heart rate","Rubber and fabric; determines cabin pressure",79,"Conductive surfaces like metals, seawater, and wet lands reflect radar waves well, allowing determination of range, altitude, direction, and speed."),

    N(7,"moderate","What are the 8 steps in building and painting a Static Aeromodel described in Chapter 18?","Study blueprint → shape parts with sandpaper → pin/assemble on blueprint → apply 2–3 thin coats dope & sand → apply surfacer → fill dents with putty/metal paste & wet sand → etch rivets & spray base/colour coats → fit details & polish","Cut metal sheets → weld joints → dip in oil → bake in oven","3D print fuselage → attach jet engine → fly immediately","Glue tissue paper → soak in water → paint with house paint",84,"Static model construction follows blueprint shaping, assembly, 2–3 thin dope coats, surfacer, putty/metal paste dent filling, wet sanding, rivet etching, painting, and detailing."),

})();

};

try {
  const saved = JSON.parse(localStorage.getItem("ncc_air_portal_v3") || "null");
  if (saved) store = { ...store, ...saved };
} catch (e) {}

function saveStore() {
  try { localStorage.setItem("ncc_air_portal_v3", JSON.stringify(store)); } catch (e) {}
}

function applyTheme() {
  document.documentElement.setAttribute("data-theme", store.theme);
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = store.theme === "dark" ? "☀️ Light" : "🌙 Dark";
  const sub = document.getElementById("hdr-sub");
  if (sub) sub.textContent = `${store.cadetName} · ${store.cadetUnit}`;
}

function toggleTheme() {
  store.theme = store.theme === "dark" ? "light" : "dark";
  saveStore();
  applyTheme();
}

function updateStreak() {
  const today = new Date().toDateString();
  if (store.streak.lastDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    store.streak.count = (store.streak.lastDate === yesterday) ? store.streak.count + 1 : 1;
    store.streak.lastDate = today;
    saveStore();
  }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sh = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { let j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => Math.floor(Math.max(0, s) / 60) + ":" + String(Math.max(0, s) % 60).padStart(2, "0");
const cnt = (s, c = null, d = "all") => QS.filter(q => q[0] === s && (c === null || q[1] === c) && (d === "all" || q[2] === d)).length;

function showModal(title, body, onConfirm, confirmLabel = "Confirm", danger = false) {
  modalRoot.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2 style="margin-top:0">${esc(title)}</h2>
        <p class="sub" style="white-space:pre-line">${esc(body)}</p>
        <div class="two">
          <button class="cta g" onclick="closeModal()">Cancel</button>
          <button class="cta" style="${danger ? 'background:var(--no);color:#fff' : ''}" id="m-ok">${esc(confirmLabel)}</button>
        </div>
      </div>
    </div>`;
  document.getElementById("m-ok").onclick = () => { closeModal(); onConfirm(); };
}
function closeModal() { modalRoot.innerHTML = ""; }

const NAV = () => `
  <nav class="nav">
    ${[
      ["home", "🏠", "Home"],
      ["practice", "📝", "Practice"],
      ["mock", "⏱️", "Mock Test"],
      ["books", "📚", "Books"],

function go(tab) {

  if (tab === "home") return renderHome();
  if (tab === "practice") return renderTestSetup("practice");
  if (tab === "mock") return renderTestSetup("mock");
  if (tab === "books") return renderBooks();
  if (tab === "profile") return renderProfile();
}

        ? "Timed exam. Answers & explanations are revealed together at the end."

      <div class="list">
        ${Object.keys(SUBJ).map(k => `
          <button class="it" onclick="state.cfg.k='${k}';state.cfg.c=null;renderTestSetup('${mode}','topic')">
            <div>
              <b>${SUBJ[k].name}</b>
              <small>${SUBJ[k].desc}</small>
            </div>
            <span class="pill">${cnt(k)} Qs ›</span>

        <button class="it ${state.cfg.c === null ? 'on' : ''}" onclick="state.cfg.c=null;renderTestSetup('${mode}','count')">

            <b>All Topics Mixed</b>

            <button class="it ${state.cfg.c === idx ? 'on' : ''}" onclick="state.cfg.c=${idx};renderTestSetup('${mode}','count')">

                <b>${idx + 1}. ${esc(chName)}</b>
                <small>Easy: ${cnt(state.cfg.k, idx, 'easy')} · Mod: ${cnt(state.cfg.k, idx, 'moderate')} · Tough: ${cnt(state.cfg.k, idx, 'tough')}</small>
              </div>
              <span class="pill">${total} Qs ›</span>
            </button>`;
        }).join("")}

    <button class="back" onclick="renderTestSetup('${mode}','topic')">‹ Topics</button>

function startMistakeDrill() {
  const mList = Object.values(store.mistakes).map(m => m.qObj);
  if (!mList.length) return;
  state.subTab = "practice";
  const qs = sh(mList).slice(0, 25).map(q => {
    const opts = sh([q[4], q[5], q[6], q[7]]);
    return {
      sub: q[0], chIdx: q[1], diff: q[2], q: q[3],
      o: opts, a: opts.indexOf(q[4]), r: q[8], exp: q[9], u: -1, m: false, raw: q
    };
  });
  state.session = {
    mode: "practice",
    isMistakeDrill: true,
    name: "Mistake Bank Revision",
    qs, i: 0, pal: false, left: 0, startTs: Date.now(), neg: false
  };
  renderQuestion();
}

function startSession(mode) {
  const pool = QS.filter(q =>
    q[0] === state.cfg.k &&
    (state.cfg.c === null || q[1] === state.cfg.c) &&
    (state.cfg.diff === "all" || q[2] === state.cfg.diff)
  );
  const qs = sh(pool).slice(0, state.cfg.n).map(q => {
    const opts = sh([q[4], q[5], q[6], q[7]]);
    return {
      sub: q[0], chIdx: q[1], diff: q[2], q: q[3],
      o: opts, a: opts.indexOf(q[4]), r: q[8], exp: q[9], u: -1, m: false, raw: q
    };
  });
  const title = (state.cfg.c === null ? SUBJ[state.cfg.k].short : SUBJ[state.cfg.k].ch[state.cfg.c]) +
    (state.cfg.diff !== "all" ? ` (${state.cfg.diff})` : "");
  state.session = {
    mode,
    name: title,
    qs, i: 0, pal: false,
    left: qs.length * 60,
    startTs: Date.now(),
    neg: mode === "mock" ? state.cfg.neg : false
  };
  clearInterval(T);
  if (mode === "mock") {
    T = setInterval(() => {
      state.session.left--;
      const el = document.getElementById("tm");
      if (el) el.textContent = "⏱️ " + fmt(state.session.left);
      if (state.session.left <= 0) finishSession();
    }, 1000);
  }
  renderQuestion();
}

function renderQuestion() {
  const ses = state.session;
  if (!ses) return;
  if (ses.pal) return renderPalette();
  const q = ses.qs[ses.i];
  const n = ses.qs.length;
  const isMock = ses.mode === "mock";
  const answered = !isMock && q.u >= 0;
  const doneCnt = ses.qs.filter(x => x.u >= 0).length;

  app.innerHTML = `
    <div class="qh">
      <span>Question <b>${ses.i + 1}</b> of ${n}</span>
      <span>${isMock ? `<span id="tm" style="font-weight:700;color:var(--ac)">⏱️ ${fmt(ses.left)}</span>` : `<b onclick="confirmEnd()">End Session</b>`}</span>
    </div>
    <div class="bar"><i style="width:${((ses.i + (answered ? 1 : 0)) / n) * 100}%"></i></div>

    ${isMock ? `
      <div class="tb">
        <button onclick="state.session.pal=true;renderQuestion()">▦ ${doneCnt}/${n} Done</button>
        <button onclick="state.session.qs[${ses.i}].m=!state.session.qs[${ses.i}].m;renderQuestion()">${q.m ? '⚑ Marked' : '⚐ Mark'}</button>
        <button class="end" onclick="confirmEnd()">Submit</button>
      </div>` : ""}

    <div class="qc">
      <div class="qmeta">
        <span class="tp">${esc(SUBJ[q.sub].ch[q.chIdx])}</span>
        <span class="diff ${q.diff}">${q.diff}</span>
      </div>
      <p class="q">${esc(q.q)}</p>
      ${q.o.map((opt, idx) => {
        let cls = "";
        if (isMock) cls = (q.u === idx ? "sel" : "");
        else if (answered) cls = (idx === q.a ? "ok" : (q.u === idx ? "no" : ""));
        return `
          <button class="o ${cls}" onclick="selectOpt(${idx})" ${answered ? "disabled" : ""}>
            <em>${"ABCD"[idx]}</em>
            <span>${esc(opt)}${answered && idx === q.a ? " ✓" : answered && q.u === idx ? " ✕" : ""}</span>
          </button>`;
      }).join("")}

      ${isMock && q.u >= 0 ? `<button class="back" style="margin-top:6px" onclick="state.session.qs[${ses.i}].u=-1;renderQuestion()">Clear selection</button>` : ""}

      ${answered ? (q.u === q.a
        ? `<div class="fb ok">
            <b>✅ Correct!</b> <span class="mu">(${esc(q.r)})</span>
            <span class="why"><b>Why it is right:</b> ${esc(q.exp)}</span>
          </div>`
        : `<div class="fb no">
            <b>❌ Incorrect.</b> Correct answer is <b>${"ABCD"[q.a]}. ${esc(q.o[q.a])}</b> <span class="mu">(${esc(q.r)})</span>
            <span class="why"><b>Why it is wrong / Explanation:</b> ${esc(q.exp)}</span>
          </div>`) : ""}
    </div>

    <div class="top"><div class="two">
      ${isMock ? `<button class="cta g" ${ses.i === 0 ? "disabled" : ""} onclick="state.session.i--;renderQuestion()">‹ Prev</button>` : ""}
      <button class="cta" ${!isMock && !answered ? "disabled" : ""} onclick="nextQuestion()">
        ${!isMock && !answered ? "Select an option" : (ses.i < n - 1 ? "Next Question ›" : (isMock ? "Review & Submit" : "Finish & View Summary"))}
      </button>
    </div></div>`;
}

function selectOpt(idx) {
  const ses = state.session;
  const q = ses.qs[ses.i];
  if (ses.mode === "practice" && q.u >= 0) return;
  q.u = idx;
  renderQuestion();
}

function nextQuestion() {
  const ses = state.session;
  if (ses.i < ses.qs.length - 1) {
    ses.i++;
    renderQuestion();
    window.scrollTo(0, 0);
  } else if (ses.mode === "mock") {
    ses.pal = true;
    renderQuestion();
  } else {
    finishSession();
  }
}

function renderPalette() {
  const ses = state.session;
  const n = ses.qs.length;
  const ans = ses.qs.filter(x => x.u >= 0).length;
  app.innerHTML = `
    <div class="qh">
      <span>${ans} Answered · ${n - ans} Unanswered</span>
      <span id="tm" style="font-weight:700;color:var(--ac)">⏱️ ${fmt(ses.left)}</span>
    </div>
    <h1>Question Palette</h1>
    <p class="sub">Tap any question number to jump directly. Orange = answered, Purple border = marked for review.</p>
    <div class="grid">
      ${ses.qs.map((q, idx) => `
        <button class="${q.u >= 0 ? 'ans' : ''} ${q.m ? 'mk' : ''} ${idx === ses.i ? 'cur' : ''}"
          onclick="state.session.i=${idx};state.session.pal=false;renderQuestion()">${idx + 1}</button>`).join("")}
    </div>
    <div class="top"><div class="two">
      <button class="cta g" onclick="state.session.pal=false;renderQuestion()">‹ Back to Test</button>
      <button class="cta" onclick="confirmEnd()">Submit Test</button>
    </div></div>`;
}

function confirmEnd() {
  const ses = state.session;
  const n = ses.qs.length;
  const ans = ses.qs.filter(x => x.u >= 0).length;
  const mk = ses.qs.filter(x => x.m).length;
  showModal(
    ses.mode === "mock" ? "Submit Mock Test?" : "Finish Practice Session?",
    ses.mode === "mock"
      ? `Answered: ${ans}/${n}\nUnanswered: ${n - ans}\nMarked for review: ${mk}\n\nAll answers and detailed explanations will be shown on the result screen.`
      : `Completed ${ans} of ${n} questions. View your score summary and save this record?`,
    () => finishSession(),
    "View Result"
  );
}

function finishSession() {
  clearInterval(T);
  updateStreak();
  const ses = state.session;
  const qs = ses.qs;
  const n = qs.length;
  const sc = qs.filter(q => q.u === q.a).length;
  const wrong = qs.filter(q => q.u >= 0 && q.u !== q.a).length;
  const skip = qs.filter(q => q.u < 0).length;
  const net = ses.neg ? Math.max(0, sc - wrong * 0.25) : sc;
  const timeSec = Math.max(1, Math.round((Date.now() - ses.startTs) / 1000));

  // Update per-topic stats & Mistake Bank
  qs.forEach(q => {
    const tKey = `${q.sub}_${q.chIdx}`;
    if (!store.topicStats[tKey]) store.topicStats[tKey] = { right: 0, total: 0 };
    if (q.u >= 0) {
      store.topicStats[tKey].total++;
      if (q.u === q.a) {
        store.topicStats[tKey].right++;
        if (ses.isMistakeDrill && store.mistakes[q.q]) delete store.mistakes[q.q];
      } else {
        store.mistakes[q.q] = { qObj: q.raw, count: (store.mistakes[q.q]?.count || 0) + 1, lastWrong: new Date().toLocaleDateString("en-IN") };
      }
    }
  });

  const record = {
    name: ses.name,
    mode: ses.mode,
    sc, wrong, skip, n,
    net: ses.neg ? net : null,
    timeSec,
    date: new Date().toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }),
    items: qs.map(q => ({
      ch: SUBJ[q.sub].ch[q.chIdx],
      diff: q.diff,
      q: q.q,
      o: q.o,
      a: q.a,
      u: q.u,
      r: q.r,
      exp: q.exp
    }))
  };
  store.hist.unshift(record);
  store.hist = store.hist.slice(0, 50);
  saveStore();
  state.revFilter = wrong + skip > 0 ? "bad" : "all";
  renderResult(record);
}

function renderResult(rec) {
  const pct = Math.round((rec.sc / Math.max(1, rec.n)) * 100);
  const filtered = state.revFilter === "bad"
    ? rec.items.filter(x => x.u !== x.a)
    : rec.items;

  app.innerHTML = `
    <h1>${rec.mode === "mock" ? "Mock Test Result" : "Practice Summary"}</h1>
    <p class="sub">${esc(rec.name)} · ${esc(rec.date)}</p>

    <div class="card">
      <div class="big">${rec.net != null ? rec.net.toFixed(2) : rec.sc}/${rec.n}</div>
      <div class="c">
        <b>${pct}% Accuracy</b> · ✅ ${rec.sc} Right · ❌ ${rec.wrong} Wrong · ⏭️ ${rec.skip} Skipped · ⏱️ ${fmt(rec.timeSec)}
        ${rec.net != null ? `<br><small>(Includes –0.25 negative marking)</small>` : ""}
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px">
      <h2 style="margin:0">Detailed Explanations</h2>
      <div class="chips" style="margin:0">
        <button class="chip ${state.revFilter === 'bad' ? 'on' : ''}" onclick="state.revFilter='bad';renderResult(currentResult)">Wrong/Skipped (${rec.wrong + rec.skip})</button>
        <button class="chip ${state.revFilter === 'all' ? 'on' : ''}" onclick="state.revFilter='all';renderResult(currentResult)">All (${rec.n})</button>
      </div>
    </div>

    ${filtered.length ? filtered.map((item, idx) => {
      const ok = item.u === item.a;
      return `
        <div class="qc" style="margin-bottom:10px">
          <div class="qmeta">
            <span class="tp">${esc(item.ch)}</span>
            <span class="diff ${item.diff}">${item.diff}</span>
          </div>
          <p class="q" style="font-size:15.5px;margin-bottom:8px">${idx + 1}. ${esc(item.q)}</p>
          <div class="fb ok" style="margin-top:6px">
            <b>✓ Correct Answer:</b> ${esc(item.o[item.a])} <span class="mu">(${esc(item.r)})</span>
            <span class="why"><b>Why it is right:</b> ${esc(item.exp)}</span>
          </div>
          ${!ok ? `<div class="fb no" style="margin-top:6px">
            <b>${item.u >= 0 ? '✕ Your Answer: ' + esc(item.o[item.u]) : '⏭️ Unattempted'}</b>
          </div>` : ""}
        </div>`;
    }).join("") : `<div class="card c">Flawless performance! Every question answered correctly. 🎉</div>`}

    <div class="top"><div class="two">
      <button class="cta g" onclick="go('profile')">All Records</button>
      <button class="cta" onclick="go('home')">Back to Home</button>
    </div></div>`;
  window.currentResult = rec;
  window.scrollTo(0, 0);
}

function openRecord(idx) {
  const rec = store.hist[idx];
  if (!rec) return;
  state.revFilter = "all";
  renderResult(rec);
}

// ================= 4. BOOKS TAB (CHAPTER-WISE READER) =================
function renderBooks() {
  const bk = state.book;
  const subKey = bk.k;
  const chapters = BOOKS[subKey];

  // If no chapter opened yet (bk.c === null), show subject switcher + chapter list so user opens only what they want to read
  if (bk.c === null) {
    app.innerHTML = `
      <h1>Books &amp; Study Material</h1>
      <p class="sub">Choose a book and tap any chapter to open its focused study notes and flashcards.</p>

      <div class="chips">
        <button class="chip ${subKey === 'sop' ? 'on' : ''}" onclick="state.book.k='sop';renderBooks()">📘 Virus SW 80 SOP (7 Ch)</button>
        <button class="chip ${subKey === 'ncc' ? 'on' : ''}" onclick="state.book.k='ncc';renderBooks()">📗 NCC Air Wing Special (8 Topics)</button>
      </div>

      <div class="list">
        ${chapters.map((ch, idx) => `
          <button class="it" onclick="state.book.c=${idx};state.book.fc=false;state.book.fcIdx=0;state.book.fcFlip=false;renderBooks()">
            <div>
              <b>${esc(ch.title)}</b>
              <small>${esc(ch.summary.slice(0, 95))}...</small>
            </div>
            <span class="pill">Read ›</span>
          </button>`).join("")}
      </div>
      ${NAV()}`;
    return;
  }

  // Specific chapter opened
  const ch = chapters[bk.c];
  const chQs = QS.filter(q => q[0] === subKey && q[1] === bk.c);
  const filteredQs = bk.q.trim()
    ? chQs.filter(q => (q[3] + " " + q[4] + " " + q[9]).toLowerCase().includes(bk.q.toLowerCase()))
    : chQs;

  app.innerHTML = `
    <button class="back" onclick="state.book.c=null;renderBooks()">‹ All Chapters (${SUBJ[subKey].short})</button>
    <h1>${esc(ch.title)}</h1>
    <p class="sub">${esc(ch.summary)}</p>

    <div class="two" style="margin-bottom:14px">
      <button class="cta blue" onclick="state.cfg.k='${subKey}';state.cfg.c=${bk.c};state.cfg.diff='all';renderTestSetup('practice','count')">
        📝 Practise Chapter (${chQs.length} Qs)
      </button>
      <button class="cta g" onclick="state.book.fc=!state.book.fc;state.book.fcIdx=0;state.book.fcFlip=false;renderBooks()">
        ${bk.fc ? "📖 Show Notes" : "🃏 Flashcards"}
      </button>
    </div>

    ${bk.fc ? renderChapterFlashcards(chQs) : `
      ${ch.sections.map(sec => `
        <div class="card book-sec">
          <h3>${esc(sec.h)}</h3>
          ${sec.bullets ? `<ul>${sec.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
          ${sec.table ? `
            <table class="tbl">
              <thead><tr>${sec.table[0].map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
              <tbody>${sec.table.slice(1).map(row => `<tr>${row.map(cell => `<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
            </table>` : ""}
        </div>`).join("")}

      ${ch.warn ? `<div class="warn-box"><b>⚠️ Important Exam &amp; Flight Note:</b> ${esc(ch.warn)}</div>` : ""}

      <h2>Chapter Question Bank Preview (${filteredQs.length})</h2>
      <input class="inp" type="search" placeholder="Search keyword inside this chapter's questions..." value="${esc(bk.q)}" oninput="state.book.q=this.value;renderBooks()">
      ${filteredQs.slice(0, 15).map((q, idx) => `
        <div class="qc" style="margin-bottom:8px;padding:12px">
          <div class="qmeta">
            <span class="tp">${esc(q[8])}</span>
            <span class="diff ${q[2]}">${q[2]}</span>
          </div>
          <b style="display:block;margin-bottom:4px">${idx + 1}. ${esc(q[3])}</b>
          <div style="color:var(--ok);font-weight:600;font-size:13.5px">✓ ${esc(q[4])}</div>
          <div class="mu" style="margin-top:4px">${esc(q[9])}</div>
        </div>`).join("")}
      ${filteredQs.length > 15 ? `<p class="c" style="font-size:13px">Showing 15 of ${filteredQs.length} questions — tap "Practise Chapter" above to drill all ${chQs.length} questions.</p>` : ""}
    `}
    ${NAV()}`;
}

function renderChapterFlashcards(chQs) {
  if (!chQs.length) return `<div class="card c">No flashcards in this chapter.</div>`;
  const idx = state.book.fcIdx % chQs.length;
  const q = chQs[idx];
  return `
    <div class="card flashcard" onclick="state.book.fcFlip=!state.book.fcFlip;renderBooks()">
      <span class="diff ${q[2]}" style="margin-bottom:10px">${q[2]} · Card ${idx + 1} of ${chQs.length}</span>
      ${!state.book.fcFlip
        ? `<b style="font-size:18px;line-height:1.4">${esc(q[3])}</b><small class="mu" style="margin-top:14px">Tap card to reveal answer &amp; explanation</small>`
        : `<b style="font-size:18px;color:var(--ok)">✓ ${esc(q[4])}</b><p class="sub" style="margin-top:10px;margin-bottom:0">${esc(q[9])}</p><small class="mu" style="margin-top:10px">${esc(q[8])}</small>`}
    </div>
    <div class="two">
      <button class="cta g" onclick="state.book.fcIdx=(state.book.fcIdx-1+${chQs.length})%${chQs.length};state.book.fcFlip=false;renderBooks()">‹ Previous</button>
      <button class="cta" onclick="state.book.fcIdx=(state.book.fcIdx+1)%${chQs.length};state.book.fcFlip=false;renderBooks()">Next Card ›</button>
    </div>`;
}

// ================= 5. PROFILE TAB (SETTINGS, RECORDS & TOOLS) =================
function renderProfile() {
  const mistakeCount = Object.keys(store.mistakes).length;
  app.innerHTML = `
    <h1>Profile &amp; Settings</h1>
    <p class="sub">Cadet details, app preferences, complete test records, topic mastery, and data backup.</p>

    <div class="card">
      <h2 style="margin-top:0">Cadet &amp; App Settings</h2>
      <label class="mu">Cadet Name</label>
      <input class="inp" value="${esc(store.cadetName)}" onchange="store.cadetName=this.value.trim()||'Cadet';saveStore();applyTheme()">
      <label class="mu">Unit / Squadron</label>
      <input class="inp" value="${esc(store.cadetUnit)}" onchange="store.cadetUnit=this.value.trim()||'NCC Air Wing';saveStore();applyTheme()">

      <div class="row-sw">
        <div>
          <b>Appearance Theme</b>
          <small class="mu">Current: ${store.theme === 'dark' ? 'Dark Cockpit Mode' : 'Light Day Mode'}</small>
        </div>
        <button class="icon-btn" onclick="toggleTheme();renderProfile()">${store.theme === 'dark' ? '☀️ Switch to Light' : '🌙 Switch to Dark'}</button>
      </div>

      <div class="row-sw">
        <div>
          <b>Default Negative Marking (–0.25)</b>
          <small class="mu">Pre-enable negative marking in Mock Tests</small>
        </div>
        <input type="checkbox" style="width:20px;height:20px;accent-color:var(--ac)" ${store.defaultNeg ? "checked" : ""} onchange="store.defaultNeg=this.checked;state.cfg.neg=this.checked;saveStore()">
      </div>
    </div>

    <h2>Mistake Bank (${mistakeCount})</h2>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div>
        <b>${mistakeCount ? mistakeCount + " Questions to Revise" : "All Clear!"}</b>
        <small class="mu">${mistakeCount ? "Wrong answers are saved automatically until answered right." : "Zero wrong answers pending in your Mistake Bank."}</small>
      </div>
      ${mistakeCount ? `<button class="cta" style="width:auto;padding:10px 14px" onclick="startMistakeDrill()">Drill Now</button>` : ""}
    </div>

    <h2>Topic-Wise Mastery</h2>
    <div class="card">
      ${Object.keys(SUBJ).map(k => `
        <b style="display:block;color:var(--ac);margin:6px 0">${SUBJ[k].short}</b>
        ${SUBJ[k].ch.map((chName, idx) => {
          const st = store.topicStats[`${k}_${idx}`] || { right: 0, total: 0 };
          const pct = st.total ? Math.round((st.right / st.total) * 100) : 0;
          return `
            <div style="margin-bottom:9px">
              <div style="display:flex;justify-content:space-between;font-size:13px">
                <span>${esc(chName)}</span>
                <span class="mu">${st.total ? `${st.right}/${st.total} (${pct}%)` : "Not attempted"}</span>
              </div>
              <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
            </div>`;
        }).join("")}`).join("")}
    </div>

    <h2>Saved Test &amp; Practice Records (${store.hist.length})</h2>
    ${store.hist.length ? `
      <div class="list">
        ${store.hist.map((h, idx) => `
          <button class="it" onclick="openRecord(${idx})">
            <div>
              <b>${esc(h.name)}</b>
              <small>${esc(h.date)} · ${h.mode === 'mock' ? 'Mock Test' : 'Practice'} · ⏱️ ${fmt(h.timeSec)}</small>
            </div>
            <span class="pill" style="color:var(--ac)">${h.net != null ? h.net.toFixed(2) : h.sc}/${h.n} ›</span>
          </button>`).join("")}
      </div>` : `<div class="card c">No test records yet. Complete a Practice or Mock Test to log your progress!</div>`}

    <h2>Data Backup &amp; Reset</h2>
    <div class="card">
      <div class="two" style="margin-bottom:10px">
        <button class="cta g" onclick="exportBackup()">⬇️ Export JSON</button>
        <button class="cta g" onclick="document.getElementById('imp-file').click()">⬆️ Import JSON</button>
        <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importBackup(event)">
      </div>
      <button class="cta" style="background:var(--nos);color:var(--no);border:1px solid var(--no);box-shadow:none" onclick="confirmReset()">🗑️ Reset All Records &amp; Mistake Bank</button>
    </div>
    ${NAV()}`;
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ncc-airwing-records-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}

function importBackup(ev) {
  const f = ev.target.files?.[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      store = { ...store, ...data };
      saveStore();
      applyTheme();
      renderProfile();
    } catch (e) {
      showModal("Invalid Backup File", "Could not parse the selected JSON file.", () => {}, "OK");
    }
  };
  r.readAsText(f);
}

function confirmReset() {
  showModal(
    "Reset All Records?",
    "This will permanently clear all saved test history, topic mastery stats, and your Mistake Bank.",
    () => {
      store.hist = [];
      store.mistakes = {};
      store.topicStats = {};
      saveStore();
      renderProfile();
    },
    "Reset Everything",
    true
  );
}

// Keyboard shortcuts during Practice / Mock Test
document.addEventListener("keydown", e => {
  if (!state.session || state.tab === "home" || state.tab === "books" || state.tab === "profile") return;
  if (modalRoot.innerHTML) return;
  const k = e.key.toLowerCase();
  if (["a", "b", "c", "d"].includes(k)) selectOpt("abcd".indexOf(k));
  else if (["1", "2", "3", "4"].includes(k)) selectOpt(Number(k) - 1);
  else if (k === "enter" || k === "arrowright") nextQuestion();
  else if (k === "m" && state.session.mode === "mock") {
    state.session.qs[state.session.i].m = !state.session.qs[state.session.i].m;
    renderQuestion();
  }
});

// Initialize
state.cfg.neg = store.defaultNeg;
applyTheme();
go("home");
</script>
