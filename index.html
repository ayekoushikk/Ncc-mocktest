const app=document.getElementById("app");let T=null,hist=[],mode="practice",tab="practice",cfg={};
try{hist=JSON.parse(localStorage.getItem("mt_hist")||"[]")}catch(e){}
const cnt=(s,c)=>QS.filter(q=>q[0]==s&&(c==null||q[1]==c)).length;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const NAV=()=>`<div class=nav>${[["practice","📝","Practice"],["mock","⏱️","Mock Tests"],["scores","📊","Scores"]].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="go('${a[0]}')"><i>${a[1]}</i>${a[2]}</button>`).join("")}</div>`;
function go(t){clearInterval(T);tab=t;if(t=="scores")return scores();mode=t;subjects()}
function subjects(){app.innerHTML=`<h1>${mode=="mock"?"Mock Tests":"Practice"}</h1><p class=sub>${mode=="mock"?"Timed test, answers shown at the end.":"Choose the subject you'd like to practise."}</p><div class=list>`+
 Object.keys(SUBJ).map(k=>`<button class=it onclick="topics('${k}')"><b>${SUBJ[k].name}</b><span>${cnt(k)} ›</span></button>`).join("")+`</div>`+NAV();}
function topics(k){const s=SUBJ[k];cfg={k,c:null};draw()}
function draw(){const s=SUBJ[cfg.k],n=cnt(cfg.k,cfg.c);
 app.innerHTML=`<button class=back onclick="subjects()">‹ Subjects</button><h1>Choose a Topic</h1><p class=sub>Practise everything in ${esc(s.name)}, or just one part of it.</p><div class=list>`+
 `<button class="it ${cfg.c==null?'on':''}" onclick="cfg.c=null;draw()"><div><b>Everything in this subject</b><small>A mix from every topic</small></div><span>${cnt(cfg.k)}</span></button>`+
 s.ch.map((c,i)=>{const m=cnt(cfg.k,i);return `<button ${m?"":"disabled"} class="it ${cfg.c===i?'on':''}" onclick="cfg.c=${i};draw()"><div><b>${esc(c)}</b>${m?"":"<small>Coming soon</small>"}</div><span>${m}</span></button>`}).join("")+`</div>`+
 `<div class=top><div><button class=cta ${n?"":"disabled"} onclick="counts()">${n?"Proceed":"Select a topic"}</button></div></div>`;}
function counts(){const n=cnt(cfg.k,cfg.c);cfg.n=Math.min(15,n);cdraw()}
function cdraw(){const n=cnt(cfg.k,cfg.c);const o=[[10,"Quick",5],[15,"Standard",10],[n,"Full set",Math.round(n*.7)]].filter((v,i,a)=>v[0]<=n&&(i<2||n>15));
 app.innerHTML=`<button class=back onclick="draw()">‹ Topics</button><h1>How Many Questions?</h1><p class=sub>A shorter set is easier to finish in one sitting.</p><div class=list>`+
 o.map(v=>`<button class="it ${cfg.n==v[0]?'on':''}" onclick="cfg.n=${v[0]};cdraw()"><div><b>${v[1]} · ${v[0]} questions</b><small>About ${v[2]} minutes</small></div><span>${cfg.n==v[0]?"✓":""}</span></button>`).join("")+`</div><p class=note>${n} questions in this selection.</p>`+
 `<div class=top><div><button class=cta onclick="start()">${mode=="mock"?"Start Mock Test":"Start Practice"}</button></div></div>`;}
function start(){const pool=QS.filter(q=>q[0]==cfg.k&&(cfg.c==null||q[1]==cfg.c));
 cfg.qs=sh(pool).slice(0,cfg.n).map(q=>{const o=sh([q[3],q[4],q[5],q[6]]);return{q:q[2],o,a:o.indexOf(q[3]),r:q[7],ch:SUBJ[cfg.k].ch[q[1]],u:-1}});
 cfg.i=0;cfg.pal=0;cfg.left=cfg.qs.length*60;cfg.name=(cfg.c==null?SUBJ[cfg.k].name:SUBJ[cfg.k].ch[cfg.c])+(mode=="mock"?" · Mock":"");
 clearInterval(T);if(mode=="mock")T=setInterval(()=>{cfg.left--;const t=document.getElementById("tm");if(t)t.textContent=fmt(cfg.left);if(cfg.left<=0)finish()},1000);show();}
function show(){if(cfg.pal)return palette();const q=cfg.qs[cfg.i],n=cfg.qs.length,mk=mode=="mock",done=!mk&&q.u>=0,ans=cfg.qs.filter(x=>x.u>=0).length;
 app.innerHTML=`<div class=qh><span>Question ${cfg.i+1} of ${n}</span><span>${mk?`<span id=tm>${fmt(cfg.left)}</span>`:`<b onclick="endTest()">End</b>`}</span></div><div class=bar><i style="width:${(cfg.i+(done?1:0))/n*100}%"></i></div>`+
 (mk?`<div class=tb><button onclick="cfg.pal=1;show()">▦ ${ans}/${n} done</button><button onclick="cfg.qs[cfg.i].m=!cfg.qs[cfg.i].m;show()">${q.m?"⚑ Marked":"⚐ Mark"}</button><button class=end onclick="endTest()">End &amp; Score</button></div>`:"")+
 `<div class=qc><div class=tp>${esc(q.ch)}</div><p class=q>${esc(q.q)}</p>`+
 q.o.map((t,j)=>{let c=mk?(q.u==j?"sel":""):done?(j==q.a?"ok":q.u==j?"no":""):"";return `<button class="o ${c}" onclick="pick(${j})"><em>${"ABCD"[j]}</em>${esc(t)}${done&&j==q.a?" ✓":done&&q.u==j?" ✕":""}</button>`}).join("")+
 (mk&&q.u>=0?`<button class=back onclick="cfg.qs[cfg.i].u=-1;show()">Clear answer</button>`:"")+
 (done?(q.u==q.a?`<div class="fb ok"><b>Correct!</b> <span class=mu>${esc(q.r)}</span></div>`:`<div class="fb no"><b>Not quite.</b><br>The correct answer is ${"ABCD"[q.a]}. <span class=mu>${esc(q.r)}</span></div>`):"")+`</div>`+
 `<div class=top><div class=two>`+(mk?`<button class="cta g" ${cfg.i?"":"disabled"} onclick="cfg.i--;show()">‹ Prev</button>`:"")+
 `<button class=cta ${!mk&&!done?"disabled":""} onclick="next()">${!mk&&!done?"Choose an answer":cfg.i<n-1?"Next ›":mk?"Review & Submit":"Finish"}</button></div></div>`;}
function pick(j){const q=cfg.qs[cfg.i];if(mode=="practice"&&q.u>=0)return;q.u=j;show()}
function next(){if(cfg.i<cfg.qs.length-1){cfg.i++;show();scrollTo(0,0)}else if(mode=="mock"){cfg.pal=1;show()}else finish()}
function endTest(){const n=cfg.qs.length,a=cfg.qs.filter(x=>x.u>=0).length,m=cfg.qs.filter(x=>x.m).length;
 if(confirm(mode=="mock"?`Answered: ${a}/${n}\nUnanswered: ${n-a}\nMarked: ${m}\n\nSubmit karke score dekhein?`:"Practice end karein? Score dikhaya jayega."))finish()}
function palette(){const n=cfg.qs.length,a=cfg.qs.filter(x=>x.u>=0).length;
 app.innerHTML=`<div class=qh><span>${a} answered · ${n-a} left</span><span id=tm>${fmt(cfg.left)}</span></div><h1 style="font-size:22px">Questions</h1><p class=sub>Kisi bhi question par jao. Purple = marked, orange = answered.</p><div class=grid>`+
 cfg.qs.map((q,j)=>`<button class="${q.u>=0?'ans':''} ${q.m?'mk':''} ${j==cfg.i?'cur':''}" onclick="cfg.i=${j};cfg.pal=0;show()">${j+1}</button>`).join("")+`</div>`+
 `<div class=top><div class=two><button class="cta g" onclick="cfg.pal=0;show()">‹ Back</button><button class=cta onclick="endTest()">End &amp; Score</button></div></div>`;}
function finish(){clearInterval(T);const qs=cfg.qs,sc=qs.filter(q=>q.u==q.a).length,n=qs.length,bad=qs.filter(q=>q.u!=q.a);
 try{hist.unshift({n:cfg.name,s:sc,t:n,d:new Date().toLocaleDateString("en-IN")});hist=hist.slice(0,30);localStorage.setItem("mt_hist",JSON.stringify(hist))}catch(e){}
 app.innerHTML=`<h1>Result</h1><div class=qc><div class=big>${sc}/${n}</div><div class=c>${Math.round(sc/n*100)}% · ${qs.filter(q=>q.u<0).length} unattempted</div></div>`+
 (bad.length?`<h2 style="font-size:17px;margin:18px 0 8px">Review (${bad.length} to revise)</h2>`+bad.map(q=>`<div class=qc style="margin-bottom:10px"><div class=tp>${esc(q.ch)}</div><b>${esc(q.q)}</b><div class="fb ok" style="margin-top:8px"><b>${esc(q.o[q.a])}</b> <span class=mu>${esc(q.r)}</span></div>${q.u>=0?`<div class="fb no">Your answer: ${esc(q.o[q.u])}</div>`:""}</div>`).join(""):`<p class=c>Perfect score! 🎉</p>`)+
 `<div class=top><div><button class=cta onclick="go(mode)">Done</button></div></div>`;scrollTo(0,0);}
function scores(){app.innerHTML=`<h1>Scores</h1><p class=sub>Aapke pichhle tests.</p>`+(hist.length?`<div class=list>`+hist.map(h=>`<div class=it><div><b>${esc(h.n)}</b><small>${h.d}</small></div><span><b style="color:var(--ac)">${h.s}/${h.t}</b></span></div>`).join("")+`</div>`:`<p class=note>Abhi koi test nahi diya.</p>`)+NAV();}
subjects();
</script></body></html>
